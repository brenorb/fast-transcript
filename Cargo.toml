[package]
name = "fast-transcript"
version = "1.1.3"
edition = "2021"
description = "Fast local transcription for large lectures with NVIDIA Parakeet ONNX"
license = "MIT"
repository = "https://github.com/brenorb/fast-transcript"
homepage = "https://github.com/brenorb/fast-transcript"
readme = "README.md"
keywords = ["transcription", "speech-to-text", "asr", "onnx", "parakeet"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "fscript"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = "4.6"
ctrlc = { version = "3.5", features = ["termination"] }
directories = "6.0"
flate2 = "1.1"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rubato = { version = "=5.1.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
strsim = "0.11"
tar = "0.4"
tempfile = "3.14"
transcribe-rs = { version = "=0.3.8", features = ["onnx"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
mach2 = "0.6"
objc2 = "0.6.5"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSValue"] }
