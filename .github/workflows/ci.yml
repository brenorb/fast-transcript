name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --check
      - name: Check generated man page
        run: python3 scripts/generate_man_page.py --check
      - name: Install conversion test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: cargo test --locked
      - name: Publish dry run
        run: cargo publish --dry-run --locked

  pypi-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Hour-long meeting clock and waveform alignment
        run: cargo test --release --locked simulated_hour_markers -- --ignored
      - name: Media selection E2E and FFmpeg differential tests
        run: uv run --no-project --with yt-dlp python -m unittest tests/test_media_range_cli.py
      - name: Streaming E2E, cancellation, and batch differential tests
        run: uv run --no-project --with yt-dlp python -m unittest tests/test_streaming_cli.py
      - name: Single-command defaults and bundled agent skill E2E
        run: uv run --no-project --with yt-dlp python -m unittest tests/test_single_cli.py
      - name: Recording lifecycle E2E and batch differential tests
        run: uv run --no-project --with yt-dlp python -m unittest tests/test_recording_cli.py
      - name: Meeting capture, live updates, cancellation, and recovery E2E
        run: uv run --no-project python -m unittest tests/test_meeting_cli.py
      - name: Automatic meeting lifecycle, admission and ownership E2E
        run: uv run --no-project python -m unittest tests/test_meeting_watch_cli.py
      - name: Passive call inspection and detector E2E
        run: uv run --no-project python -m unittest tests/test_calls_cli.py
      - name: Calendar access, context matching and preference E2E
        run: uv run --no-project python -m unittest tests/test_calendar_cli.py
      - name: External agent notes E2E and control CLI tests
        run: uv run --no-project python -m unittest tests/test_agent_notes_cli.py
      - name: Completed export E2E and batch differential tests
        run: uv run --no-project --with yt-dlp python -m unittest tests/test_transcript_export_cli.py
      - name: Python wrapper tests
        run: uv run --no-project python -m unittest tests/test_pypi_wrapper.py
      - name: Model worker protocol tests
        run: uv run --no-project python -m unittest tests/test_model_worker.py
      - name: Persistent model preference CLI tests
        run: uv run --no-project python -m unittest tests/test_default_model_cli.py
      - name: Build wheel
        run: uv run --no-project --with build python scripts/build_pypi_wheel.py --out-dir dist-pypi
      - name: Validate release binary and wheel stay in sync
        run: uv run --no-project python -m unittest tests/test_release_artifacts.py
      - name: Smoke test installed wheel entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-smoke
          . .wheel-smoke/bin/activate
          python -m pip install dist-pypi/*.whl
          fscript --version
          fscript --help >/dev/null

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native client test dependencies
        run: brew install ffmpeg
      - name: Build the shared CLI
        run: cargo build --locked
      - name: Native shortcut state properties
        run: 'cargo test --locked shortcut::'
      - name: Native process E2E, protocol properties, and batch differential tests
        run: python3 scripts/test_desktop_client.py
      - name: Build development app bundle
        run: bash scripts/build_macos_app.sh --debug
      - name: Verify app signature and bundled command entrypoint
        run: |
          codesign --verify --deep --strict 'target/desktop/Fast Transcript.app'
          plutil -lint 'target/desktop/Fast Transcript.app/Contents/Info.plist'
          'target/desktop/Fast Transcript.app/Contents/Helpers/fscript' --version
          'target/desktop/Fast Transcript.app/Contents/Helpers/fscript' models --json

      - name: Hardened app archive, checksum, installed CLI and notarization contracts
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(python3 scripts/package_macos_app.py --debug --hardened-runtime --output-dir target/macos-package)"
          FSCRIPT_MACOS_PACKAGE_DIR="$artifact" python3 -m unittest tests/test_macos_package.py
